<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP - Portfolio</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        body{
            margin:0;
            font-family:'Kanit',sans-serif;
            background:linear-gradient(135deg,#ffffff,#eaf4ff,#ffffff);
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        h1{
            text-align:center;
            font-size:40px;
            color:#1f3b73;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .pdf-box{
            background:rgba(255,255,255,.6);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        iframe{
            width:100%;
            height:800px;
            border:none;
            border-radius:15px;
        }

        .back{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#4da3ff;
            color:white;
            text-decoration:none;
            border-radius:10px;
            transition:.3s;
        }

        .back:hover{
            background:#1d7ef5;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Statement of Purpose (SOP)</h1>

    <p>แฟ้ม Statement of Purpose</p>

    <div class="pdf-box">

        <iframe src="../pdf/SOP.pdf"></iframe>

    </div>

    <a href="../index.html" class="back">← กลับหน้าแรก</a>

</div>

</body>
</html>
