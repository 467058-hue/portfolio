<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activity</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{
background:linear-gradient(135deg,#eef5ff,#ffffff,#dcecff);
padding:40px;
}

h1{
text-align:center;
font-size:48px;
margin-bottom:40px;
color:#2d4b7c;
}

.gallery{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}

.card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.12);

cursor:pointer;

transition:.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:100%;

height:250px;

object-fit:cover;

}

.card h3{

padding:18px;

text-align:center;

font-size:20px;

}

/* Popup */

.popup{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.85);

justify-content:center;

align-items:center;

z-index:999;

}

.popup-content{

background:white;

padding:20px;

border-radius:20px;

max-width:900px;

width:90%;

text-align:center;

position:relative;

animation:zoom .3s;

}

@keyframes zoom{

from{transform:scale(.8);opacity:0;}

to{transform:scale(1);opacity:1;}

}

.popup img{

width:100%;

border-radius:15px;

}

.popup h2{

margin-top:20px;

color:#333;

}

.close{

position:absolute;

right:20px;

top:10px;

font-size:40px;

cursor:pointer;

color:#444;

}

.back{

display:block;

width:220px;

margin:50px auto 0;

padding:15px;

text-align:center;

text-decoration:none;

background:#3d8bfd;

color:white;

border-radius:12px;

font-size:18px;

transition:.3s;

}

.back:hover{

background:#1f6fe5;

}

</style>

</head>

<body>

<h1>กิจกรรม</h1>

<div class="gallery">

<div class="card" onclick="openPopup('picphoome1.jpeg','กิจกรรมทำพานไหว้คุณครูระดับชั้น มัธยมศึกษา ม.5')">
<img src="picphoome1.jpeg">
<h3>ทำพานไหว้ครู ม.5</h3>
</div>

<div class="card" onclick="openPopup('picphoome2.jpeg','กิจกรรมสาธารณประโยชน์')">
<img src="picphoome2.jpeg">
<h3>สาธารณประโยชน์</h3>
</div>

<div class="card" onclick="openPopup('picphoome3.jpeg','กิจกรรมโครงการเข้าค่ายคุณธรรม จริยธรรม')">
<img src="picphoome3.jpeg">
<h3>เข้าค่ายคุณธรรม</h3>
</div>

<div class="card" onclick="openPopup('picphoome4.jpeg','กิจกรรมออกแบบแบรนด์และสร้างผลิตภัณฑ์ ม.5')">
<img src="picphoome4.jpeg">
<h3>ออกแบบแบรนด์</h3>
</div>

<div class="card" onclick="openPopup('picphoome5.jpeg','กิจกรรมตัวแทนเข้าร่วมทำพานไหว้ครู ม.4')">
<img src="picphoome5.jpeg">
<h3>ตัวแทนทำพานไหว้ครู ม.4</h3>
</div>

<div class="card" onclick="openPopup('picphoome6.jpeg','กิจกรรมหล่อเทียนพรรษา')">
<img src="picphoome6.jpeg">
<h3>หล่อเทียนพรรษา</h3>
</div>

</div>

<div class="popup" id="popup">

<div class="popup-content">

<span class="close" onclick="closePopup()">&times;</span>

<img id="popupImage">

<h2 id="popupTitle"></h2>

</div>

</div>

<a href="index.html" class="back">← กลับหน้าแรก</a>

<script>

function openPopup(image,title){

document.getElementById("popup").style.display="flex";

document.getElementById("popupImage").src=image;

document.getElementById("popupTitle").innerHTML=title;

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

window.onclick=function(event){

if(event.target==document.getElementById("popup")){

closePopup();

}

}

</script>

</body>
</html>
